name: Sayar CI

on:
  push:
    branches: [main, feature/whatsapp-support-health-check]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android APK (only after explicitly requested)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          echo "---BUILD-LOG---"
          cat build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

  android:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/whatsapp-support-health-check')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install
      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee android-build.log
      - name: Upload Android web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-build-log
          path: android-build.log
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate temporary release signing key
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="saysay-release"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SaySay Release, OU=Mobile, O=SaySay, L=Unknown, ST=Unknown, C=US"
          chmod 600 "$RUNNER_TEMP/release-key.jks"
          {
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          if "signingConfigs.release" in text:
              raise SystemExit("Release signing appears to be configured already; refusing to duplicate it.")

          build_types = re.search(r"(?m)^([ ]*)buildTypes[ ]*[{]", text)
          if not build_types:
              raise SystemExit("Could not find buildTypes block in android/app/build.gradle")
          indent = build_types.group(1)
          signing = (
              f"{indent}signingConfigs {{\n"
              f"{indent}    release {{\n"
              f"{indent}        storeFile file(System.getenv('RUNNER_TEMP') + '/release-key.jks')\n"
              f"{indent}        storePassword System.getenv('KEYSTORE_PASSWORD')\n"
              f"{indent}        keyAlias System.getenv('KEY_ALIAS')\n"
              f"{indent}        keyPassword System.getenv('KEY_PASSWORD')\n"
              f"{indent}    }}\n"
              f"{indent}}}\n\n"
          )
          text = text[:build_types.start()] + signing + text[build_types.start():]

          build_types = re.search(r"(?m)^([ ]*)buildTypes[ ]*[{]", text)
          start = build_types.end()
          depth = 1
          i = start
          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1
          block = text[build_types.start():i]
          release = re.search(r"(?m)^([ ]*)release[ ]*[{]", block)
          if not release:
              raise SystemExit("Could not find release block inside buildTypes")
          release_indent = release.group(1)
          insert_at = release.end()
          block = block[:insert_at] + f"\n{release_indent}    signingConfig signingConfigs.release" + block[insert_at:]
          text = text[:build_types.start()] + block + text[i:]
          gradle.write_text(text)
          PY
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
