name: Sayar CI

on:
  push:
    branches: [main, feature/whatsapp-support-health-check]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android APK (only after explicitly requested)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          echo "---BUILD-LOG---"
          cat build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

  android:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/whatsapp-support-health-check')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: npm install
      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee android-build.log
      - name: Upload Android web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-build-log
          path: android-build.log
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sai-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
