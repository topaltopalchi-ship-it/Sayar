name: Build and Release Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Android icon rendering dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install cairosvg Pillow

      - name: Restore Sai Sai launcher logo
        run: .venv/bin/python scripts/restore-android-icon.py

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/saisai-release.keystore" -storepass "saisai-temp-pass" -keypass "saisai-temp-pass" -alias saisai-release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SAI SAI, OU=Release, O=SAI SAI, L=Baku, ST=Baku, C=AZ"
      - name: Sign APK
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          INPUT_APK="$APK_DIR/app-release-unsigned.apk"
          if [ ! -f "$INPUT_APK" ]; then INPUT_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*signed*' | head -n 1)"; fi
          test -n "$INPUT_APK" && test -f "$INPUT_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/saisai-release.keystore" --ks-pass pass:saisai-temp-pass --key-pass pass:saisai-temp-pass --ks-key-alias saisai-release --out "$APK_DIR/SaiSai-signed.apk" "$INPUT_APK"
          "$APKSIGNER" verify --verbose "$APK_DIR/SaiSai-signed.apk"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaySai-signed-APK
          path: android/app/build/outputs/apk/release/SaiSai-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: SaySai v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/SaiSai-signed.apk
