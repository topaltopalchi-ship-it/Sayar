name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK for direct testing
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/sayar-test.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android -alias sayar-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sayar Test, OU=Testing, O=Sayar, L=Baku, ST=Baku, C=AZ"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out "$APK_DIR/app-release.apk" "$UNSIGNED_APK"
          "$APKSIGNER" verify "$APK_DIR/app-release.apk"

      - name: Show generated APK
        run: find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sayar-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
