name: Build and Release Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Android icon rendering dependencies
        run: python3 -m pip install --break-system-packages cairosvg Pillow

      - name: Restore Sai Sai launcher logo
        run: python3 scripts/restore-android-icon.py

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Add all Android signing secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/saisai-release.keystore"
          test -s "$RUNNER_TEMP/saisai-release.keystore"
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          INPUT_APK="$APK_DIR/app-release-unsigned.apk"
          if [ ! -f "$INPUT_APK" ]; then
            INPUT_APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*signed*' | head -n 1)"
          fi
          test -n "$INPUT_APK" && test -f "$INPUT_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/saisai-release.keystore" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" --out "$APK_DIR/SaiSai-signed.apk" "$INPUT_APK"
          "$APKSIGNER" verify --verbose "$APK_DIR/SaiSai-signed.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaySai-signed-APK
          path: android/app/build/outputs/apk/release/SaiSai-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: SaySai v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/SaiSai-signed.apk
